          }

          @Composable
          fun NotesScreen(selectedClass: String, selectedSubject: String, onBack: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(18.dp).verticalScroll(rememberScrollState())) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("नमुना नोट्स: $selectedSubject (इयत्ता $selectedClass)", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Text("[नमुना शैक्षणिक सामग्री - Karnataka Board]", fontSize = 12.sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(16.dp))
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = CardSurface)) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("धडा: रासायनिक अभिक्रिया आणि समीकरणे", fontWeight = FontWeight.Bold, color = PrimaryPurple, fontSize = 16.sp)
                          Spacer(modifier = Modifier.height(8.dp))
                          Text("• रासायनिक अभिक्रिया: जेव्हा एक किंवा अधिक पदार्थ रूपांतरित होऊन नवीन पदार्थ तयार होतात.\n• अभिक्रियाकारक (Reactants): अभिक्रियेत भाग घेणारे मूळ पदार्थ.\n• उत्पादिते (Products): अभिक्रियेतून तयार होणारे नवीन पदार्थ.\n• संतुलित समीकरण: दोन्ही बाजूंच्या अणूंची संख्या समान असणे आवश्यक आहे.", lineHeight = 22.sp, fontSize = 14.sp)
                      }
                  }
              }
          }

          @Composable
          fun MathsSolverScreen(onBack: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(18.dp).verticalScroll(rememberScrollState())) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("पायरी-पायरीने गणित स्पष्टीकरण", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Text("[नमुना स्पष्टीकरण - Step-by-Step Guide]", fontSize = 12.sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(16.dp))
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = SecondaryBlue.copy(alpha = 0.1f))) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("समीकरण सोडवा: 2x + 7 = 19, तर x = ?", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                      }
                  }
                  Spacer(modifier = Modifier.height(16.dp))
                  Text("पायरी १: 2x + 7 = 19\nपायरी २: 2x = 19 - 7\nपायरी ३: 2x = 12\nपायरी ४: x = 12 / 2\nउत्तर: x = 6", lineHeight = 26.sp, fontSize = 16.sp)
              }
          }

          data class Question(val q: String, val options: List<String>, val correct: Int)

          @Composable
          fun QuizScreen(selectedSubject: String, onBack: () -> Unit) {
              val questions = listOf(
                  Question("पाण्याचे रासायनिक सूत्र काय आहे?", listOf("NaCl", "CO2", "H2O", "O2"), 2),
                  Question("त्रिकोणाच्या तिन्ही कोनांची बेरीज किती असते?", listOf("90°", "180°", "360°", "270°"), 1)
              )
              var qIdx by remember { mutableStateOf(0) }
              var selected by remember { mutableStateOf<Int?>(null) }
              var score by remember { mutableStateOf(0) }
              var done by remember { mutableStateOf(false) }

              Column(modifier = Modifier.fillMaxSize().padding(18.dp)) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("सराव चाचणी ($selectedSubject)", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Spacer(modifier = Modifier.height(16.dp))
                  if (!done) {
                      val current = questions[qIdx]
                      Text("प्रश्न ${qIdx + 1} / ${questions.size}", color = SecondaryBlue, fontWeight = FontWeight.Bold)
                      Spacer(modifier = Modifier.height(6.dp))
                      Text(current.q, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Spacer(modifier = Modifier.height(14.dp))
                      current.options.forEachIndexed { i, opt ->
                          OutlinedButton(
                              onClick = { selected = i },
                              modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                              colors = ButtonDefaults.outlinedButtonColors(
                                  containerColor = if (selected == i) PrimaryPurple.copy(alpha = 0.15f) else Color.Transparent
                              )
                          ) {
                              Text(opt, color = TextDark)
                          }
                      }
                      Spacer(modifier = Modifier.height(16.dp))
                      Button(
                          onClick = {
                              if (selected == current.correct) score++
                              if (qIdx + 1 < questions.size) {
                                  qIdx++
                                  selected = null
                              } else done = true
                          },
                          enabled = selected != null,
                          modifier = Modifier.fillMaxWidth().height(50.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = PrimaryPurple)
                      ) {
                          Text(if (qIdx + 1 < questions.size) "पुढील प्रश्न (Next)" else "निकाल पहा (Finish)")
                      }
                  } else {
                      Card(modifier = Modifier.fillMaxWidth().padding(top = 20.dp)) {
                          Column(modifier = Modifier.padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("अभिनंदन!", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                              Text("तुमचा निकाल: $score / ${questions.size}", fontSize = 18.sp)
                              Spacer(modifier = Modifier.height(16.dp))
                              Button(onClick = { qIdx = 0; selected = null; score = 0; done = false }) { Text("पुन्हा सोडवा (Restart)") }
                          }
                      }
                  }
              }
          }

          data class Task(val id: Long, val text: String, val done: Boolean)

          @Composable
          fun ChecklistScreen(prefs: SharedPreferences, onBack: () -> Unit) {
              var taskString by remember { mutableStateOf(prefs.getString("tasks", "1:विज्ञान धडा १ वाचन:true,2:गणित सरावसंच सोडवणे:false") ?: "") }
              var newText by remember { mutableStateOf("") }

              val tasks = remember(taskString) {
                  if (taskString.isBlank()) emptyList()
                  else taskString.split(",").filter { it.isNotBlank() }.mapNotNull {
                      val p = it.split(":")
                      if (p.size == 3) Task(p[0].toLong(), p[1], p[2].toBoolean()) else null
                  }
              }

              fun save(updated: List<Task>) {
                  val s = updated.joinToString(",") { "${it.id}:${it.text}:${it.done}" }
                  prefs.edit().putString("tasks", s).apply()
                  taskString = s
              }

              Column(modifier = Modifier.fillMaxSize().padding(18.dp)) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("दैनिक अभ्यास यादी (Checklist)", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Spacer(modifier = Modifier.height(14.dp))
                  Row(modifier = Modifier.fillMaxWidth()) {
                      OutlinedTextField(value = newText, onValueChange = { newText = it }, placeholder = { Text("नवीन कार्य...") }, modifier = Modifier.weight(1f))
                      Spacer(modifier = Modifier.width(6.dp))
                      Button(onClick = {
                          if (newText.isNotBlank()) {
                              save(tasks + Task(System.currentTimeMillis(), newText.trim(), false))
                              newText = ""
                          }
                      }) { Icon(Icons.Default.Add, contentDescription = null) }
                  }
                  Spacer(modifier = Modifier.height(12.dp))
                  LazyColumn {
                      items(tasks) { t ->
                          Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                              Row(modifier = Modifier.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Checkbox(checked = t.done, onCheckedChange = { chk -> save(tasks.map { if (it.id == t.id) it.copy(done = chk) else it }) })
                                  Text(t.text, modifier = Modifier.weight(1f))
                                  IconButton(onClick = { save(tasks.filterNot { it.id == t.id }) }) { Icon(Icons.Default.Delete, contentDescription = null, tint = Color.Red) }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LargeButton(title: String, subtitle: String, isSelected: Boolean, onClick: () -> Unit) {
              Card(
                  modifier = Modifier.fillMaxWidth().clickable { onClick() },
                  colors = CardDefaults.cardColors(containerColor = if (isSelected) PrimaryPurple.copy(alpha = 0.12f) else CardSurface),
                  border = if (isSelected) androidx.compose.foundation.BorderStroke(2.dp, PrimaryPurple) else null
              ) {
                  Row(modifier = Modifier.padding(18.dp), verticalAlignment = Alignment.CenterVertically) {
                      Column(modifier = Modifier.weight(1f)) {
                          Text(title, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                          Text(subtitle, fontSize = 13.sp, color = Color.Gray)
                      }
                      if (isSelected) Icon(Icons.Default.CheckCircle, contentDescription = null, tint = PrimaryPurple)
                  }
              }
          }

          @Composable
          fun DashCard(title: String, icon: androidx.compose.ui.graphics.vector.ImageVector, color: Color, onClick: () -> Unit) {
              Card(modifier = Modifier.fillMaxWidth().clickable { onClick() }) {
                  Row(modifier = Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                      Icon(icon, contentDescription = null, tint = color, modifier = Modifier.size(32.dp))
                      Spacer(modifier = Modifier.width(14.dp))
                      Text(title, fontWeight = FontWeight.SemiBold, fontSize = 15.sp)
                  }
              }
          }
