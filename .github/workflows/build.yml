          @Composable
          fun LanguageSelectScreen(selectedLang: String, onSelect: (String) -> Unit) {
              val languages = listOf("मराठी" to "Marathi (कर्नाटक राज्य अभ्यासक्रम)", "Hindi" to "हिंदी", "English" to "English Medium")
              Column(modifier = Modifier.fillMaxSize().padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
