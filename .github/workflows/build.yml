              }
          }

          @Composable
          fun ClassSelectScreen(selectedClass: String, onSelect: (String) -> Unit, onBack: () -> Unit) {
              val classes = listOf("8" to "इयत्ता ८ वी (Class 8th)", "9" to "इयत्ता ९ वी (Class 9th)", "10" to "इयत्ता १० वी - SSLC (Class 10th)")
              Column(modifier = Modifier.fillMaxSize().padding(24.dp)) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("वर्ग निवडा / Select Class", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Spacer(modifier = Modifier.height(24.dp))
                  classes.forEach { (cls, label) ->
                      LargeButton(title = label, subtitle = "कर्नाटक राज्य पाठ्यपुस्तक अभ्यासक्रम", isSelected = selectedClass == cls, onClick = { onSelect(cls) })
                      Spacer(modifier = Modifier.height(14.dp))
                  }
              }
          }

          @Composable
          fun SubjectSelectScreen(selectedSubject: String, onSelect: (String) -> Unit, onBack: () -> Unit) {
              val subjects = listOf("विज्ञान" to "Science", "गणित" to "Mathematics", "इंग्रजी" to "English", "समाज विज्ञान" to "Social Science")
              Column(modifier = Modifier.fillMaxSize().padding(24.dp)) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("विषय निवडा / Select Subject", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Spacer(modifier = Modifier.height(24.dp))
                  subjects.forEach { (subj, desc) ->
                      LargeButton(title = subj, subtitle = desc, isSelected = selectedSubject == subj, onClick = { onSelect(subj) })
                      Spacer(modifier = Modifier.height(14.dp))
                  }
              }
          }

          @Composable
          fun DashboardScreen(selectedLang: String, selectedClass: String, selectedSubject: String, onNavigateTo: (AppScreen) -> Unit, onChangeSettings: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(20.dp).verticalScroll(rememberScrollState())) {
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = PrimaryPurple), shape = RoundedCornerShape(16.dp)) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("StudySaathi AI", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                              TextButton(onClick = onChangeSettings) { Text("बदला (Edit)", color = Color.White) }
                          }
                          Text("वर्ग: $selectedClass वी | विषय: $selectedSubject | भाषा: $selectedLang", color = Color.White.copy(alpha = 0.9f), fontSize = 14.sp)
                      }
                  }
                  Spacer(modifier = Modifier.height(24.dp))
                  Text("अभ्यास विभाग (Sections)", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                  Spacer(modifier = Modifier.height(12.dp))
                  DashCard("१. अभ्यासाच्या नोट्स (Notes)", Icons.Default.AutoStories, PrimaryPurple) { onNavigateTo(AppScreen.Notes) }
                  Spacer(modifier = Modifier.height(12.dp))
                  DashCard("२. पायरीने गणित स्पष्टीकरण (Maths)", Icons.Default.Calculate, SecondaryBlue) { onNavigateTo(AppScreen.MathsSolver) }
                  Spacer(modifier = Modifier.height(12.dp))
                  DashCard("३. सराव चाचणी (Practice Quiz)", Icons.Default.Quiz, AccentPurple) { onNavigateTo(AppScreen.Quiz) }
                  Spacer(modifier = Modifier.height(12.dp))
                  DashCard("४. दैनिक अभ्यास यादी (Checklist)", Icons.Default.Checklist, Color(0xFF2E7D32)) { onNavigateTo(AppScreen.Checklist) }
