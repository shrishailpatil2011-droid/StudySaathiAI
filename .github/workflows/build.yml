        with:
          name: StudySaathi-APK
          path: app/build/outputs/apk/debug/app-debug.apkname: Build StudySaathi APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Create App Code & Structure
        run: |
          mkdir -p app/src/main/java/com/studysaathi/ai
          mkdir -p app/src/main/res/values

          # settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "StudySaathiAI"
          include(":app")
          EOF

          # root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.studysaathi.ai"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.studysaathi.ai"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              buildFeatures {
                  compose = true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.8"
              }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="StudySaathi AI"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/studysaathi/ai/MainActivity.kt
          package com.studysaathi.ai

          import android.content.Context
          import android.content.SharedPreferences
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          val PrimaryPurple = Color(0xFF5B2C98)
          val SecondaryBlue = Color(0xFF1E88E5)
          val AccentPurple = Color(0xFF7E57C2)
          val SoftBackground = Color(0xFFF7F8FC)
          val CardSurface = Color(0xFFFFFFFF)
          val TextDark = Color(0xFF1A1A24)

          sealed class AppScreen {
              object Welcome : AppScreen()
              object LanguageSelect : AppScreen()
              object ClassSelect : AppScreen()
              object SubjectSelect : AppScreen()
              object Dashboard : AppScreen()
              object Notes : AppScreen()
              object MathsSolver : AppScreen()
              object Quiz : AppScreen()
              object Checklist : AppScreen()
          }

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { StudySaathiApp() }
              }
          }

          @Composable
          fun StudySaathiApp() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("studysaathi_prefs", Context.MODE_PRIVATE) }
              var currentScreen by remember { mutableStateOf<AppScreen>(AppScreen.Welcome) }
              var selectedLanguage by remember { mutableStateOf(prefs.getString("lang", "मराठी") ?: "मराठी") }
              var selectedClass by remember { mutableStateOf(prefs.getString("class", "10") ?: "10") }
              var selectedSubject by remember { mutableStateOf(prefs.getString("subject", "गणित") ?: "गणित") }

              MaterialTheme(
                  colorScheme = lightColorScheme(
                      primary = PrimaryPurple,
                      secondary = SecondaryBlue,
                      background = SoftBackground,
                      surface = CardSurface
                  )
              ) {
                  Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                      when (currentScreen) {
                          is AppScreen.Welcome -> WelcomeScreen(onGetStarted = { currentScreen = AppScreen.LanguageSelect })
                          is AppScreen.LanguageSelect -> LanguageSelectScreen(
                              selectedLang = selectedLanguage,
                              onSelect = { lang ->
                                  selectedLanguage = lang
                                  prefs.edit().putString("lang", lang).apply()
                                  currentScreen = AppScreen.ClassSelect
                              }
                          )
                          is AppScreen.ClassSelect -> ClassSelectScreen(
                              selectedClass = selectedClass,
                              onSelect = { cls ->
                                  selectedClass = cls
                                  prefs.edit().putString("class", cls).apply()
                                  currentScreen = AppScreen.SubjectSelect
                              },
                              onBack = { currentScreen = AppScreen.LanguageSelect }
                          )
                          is AppScreen.SubjectSelect -> SubjectSelectScreen(
                              selectedSubject = selectedSubject,
                              onSelect = { subj ->
                                  selectedSubject = subj
                                  prefs.edit().putString("subject", subj).apply()
                                  currentScreen = AppScreen.Dashboard
                              },
                              onBack = { currentScreen = AppScreen.ClassSelect }
                          )
                          is AppScreen.Dashboard -> DashboardScreen(
                              selectedLang = selectedLanguage,
                              selectedClass = selectedClass,
                              selectedSubject = selectedSubject,
                              onNavigateTo = { screen -> currentScreen = screen },
                              onChangeSettings = { currentScreen = AppScreen.LanguageSelect }
                          )
                          is AppScreen.Notes -> NotesScreen(selectedClass = selectedClass, selectedSubject = selectedSubject, onBack = { currentScreen = AppScreen.Dashboard })
                          is AppScreen.MathsSolver -> MathsSolverScreen(onBack = { currentScreen = AppScreen.Dashboard })
                          is AppScreen.Quiz -> QuizScreen(selectedSubject = selectedSubject, onBack = { currentScreen = AppScreen.Dashboard })
                          is AppScreen.Checklist -> ChecklistScreen(prefs = prefs, onBack = { currentScreen = AppScreen.Dashboard })
                      }
                  }
              }
          }

          @Composable
          fun WelcomeScreen(onGetStarted: () -> Unit) {
              Column(
                  modifier = Modifier.fillMaxSize().padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  Card(
                      colors = CardDefaults.cardColors(containerColor = PrimaryPurple.copy(alpha = 0.1f)),
                      shape = RoundedCornerShape(24.dp),
                      modifier = Modifier.size(100.dp)
                  ) {
                      Box(contentAlignment = Alignment.Center, modifier = Modifier.fillMaxSize()) {
                          Icon(Icons.Default.MenuBook, contentDescription = null, tint = PrimaryPurple, modifier = Modifier.size(50.dp))
                      }
                  }
                  Spacer(modifier = Modifier.height(24.dp))
                  Text("StudySaathi AI", fontSize = 32.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Spacer(modifier = Modifier.height(10.dp))
                  Text("कर्नाटक मराठी माध्यम विद्यार्थ्यांचा डिजिटल मार्गदर्शक\n(Classes 8, 9 & 10)", fontSize = 16.sp, textAlign = TextAlign.Center, color = TextDark)
                  Spacer(modifier = Modifier.height(36.dp))
                  Button(
                      onClick = onGetStarted,
                      modifier = Modifier.fillMaxWidth().height(56.dp),
                      shape = RoundedCornerShape(16.dp),
                      colors = ButtonDefaults.buttonColors(containerColor = PrimaryPurple)
                  ) {
                      Text("सुरू करा / Get Started", fontSize = 18.sp)
                      Spacer(modifier = Modifier.width(8.dp))
                      Icon(Icons.Default.ArrowForward, contentDescription = null)
                  }
              }
          }

          @Composable
          fun LanguageSelectScreen(selectedLang: String, onSelect: (String) -> Unit) {
              val languages = listOf("मराठी" to "Marathi (कर्नाटक राज्य अभ्यासक्रम)", "Hindi" to "हिंदी", "English" to "English Medium")
              Column(modifier = Modifier.fillMaxSize().padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                  Spacer(modifier = Modifier.height(20.dp))
                  Text("भाषा निवडा / Select Language", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Spacer(modifier = Modifier.height(30.dp))
                  languages.forEach { (lang, desc) ->
                      LargeButton(title = lang, subtitle = desc, isSelected = selectedLang == lang, onClick = { onSelect(lang) })
                      Spacer(modifier = Modifier.height(14.dp))
                  }
              }
          }

          @Composable
          fun ClassSelectScreen(selectedClass: String, onSelect: (String) -> Unit, onBack: () -> Unit) {
              val classes = listOf("8" to "इयत्ता ८ वी (Class 8th)", "9" to "इयत्ता ९ वी (Class 9th)", "10" to "इयत्ता १० वी - SSLC (Class 10th)")
              Column(modifier = Modifier.fillMaxSize().padding(24.dp)) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("वर्ग निवडा / Select Class", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Spacer(modifier = Modifier.height(24.dp))
                  classes.forEach { (cls, label) ->
                      LargeButton(title = label, subtitle = "कर्नाटक राज्य पाठ्यपुस्तक अभ्यासक्रम", isSelected = selectedClass == cls, onClick = { onSelect(cls) })
                      Spacer(modifier = Modifier.height(14.dp))
                  }
              }
          }

          @Composable
          fun SubjectSelectScreen(selectedSubject: String, onSelect: (String) -> Unit, onBack: () -> Unit) {
              val subjects = listOf("विज्ञान" to "Science", "गणित" to "Mathematics", "इंग्रजी" to "English", "समाज विज्ञान" to "Social Science")
              Column(modifier = Modifier.fillMaxSize().padding(24.dp)) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("विषय निवडा / Select Subject", fontSize = 24.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Spacer(modifier = Modifier.height(24.dp))
                  subjects.forEach { (subj, desc) ->
                      LargeButton(title = subj, subtitle = desc, isSelected = selectedSubject == subj, onClick = { onSelect(subj) })
                      Spacer(modifier = Modifier.height(14.dp))
                  }
              }
          }

          @Composable
          fun DashboardScreen(selectedLang: String, selectedClass: String, selectedSubject: String, onNavigateTo: (AppScreen) -> Unit, onChangeSettings: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(20.dp).verticalScroll(rememberScrollState())) {
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = PrimaryPurple), shape = RoundedCornerShape(16.dp)) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {
                              Text("StudySaathi AI", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                              TextButton(onClick = onChangeSettings) { Text("बदला (Edit)", color = Color.White) }
                          }
                          Text("वर्ग: $selectedClass वी | विषय: $selectedSubject | भाषा: $selectedLang", color = Color.White.copy(alpha = 0.9f), fontSize = 14.sp)
                      }
                  }
                  Spacer(modifier = Modifier.height(24.dp))
                  Text("अभ्यास विभाग (Sections)", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                  Spacer(modifier = Modifier.height(12.dp))
                  DashCard("१. अभ्यासाच्या नोट्स (Notes)", Icons.Default.AutoStories, PrimaryPurple) { onNavigateTo(AppScreen.Notes) }
                  Spacer(modifier = Modifier.height(12.dp))
                  DashCard("२. पायरीने गणित स्पष्टीकरण (Maths)", Icons.Default.Calculate, SecondaryBlue) { onNavigateTo(AppScreen.MathsSolver) }
                  Spacer(modifier = Modifier.height(12.dp))
                  DashCard("३. सराव चाचणी (Practice Quiz)", Icons.Default.Quiz, AccentPurple) { onNavigateTo(AppScreen.Quiz) }
                  Spacer(modifier = Modifier.height(12.dp))
                  DashCard("४. दैनिक अभ्यास यादी (Checklist)", Icons.Default.Checklist, Color(0xFF2E7D32)) { onNavigateTo(AppScreen.Checklist) }
              }
          }

          @Composable
          fun NotesScreen(selectedClass: String, selectedSubject: String, onBack: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(18.dp).verticalScroll(rememberScrollState())) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("नमुना नोट्स: $selectedSubject (इयत्ता $selectedClass)", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Text("[नमुना शैक्षणिक सामग्री - Karnataka Board]", fontSize = 12.sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(16.dp))
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = CardSurface)) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("धडा: रासायनिक अभिक्रिया आणि समीकरणे", fontWeight = FontWeight.Bold, color = PrimaryPurple, fontSize = 16.sp)
                          Spacer(modifier = Modifier.height(8.dp))
                          Text("• रासायनिक अभिक्रिया: जेव्हा एक किंवा अधिक पदार्थ रूपांतरित होऊन नवीन पदार्थ तयार होतात.\n• अभिक्रियाकारक (Reactants): अभिक्रियेत भाग घेणारे मूळ पदार्थ.\n• उत्पादिते (Products): अभिक्रियेतून तयार होणारे नवीन पदार्थ.\n• संतुलित समीकरण: दोन्ही बाजूंच्या अणूंची संख्या समान असणे आवश्यक आहे.", lineHeight = 22.sp, fontSize = 14.sp)
                      }
                  }
              }
          }

          @Composable
          fun MathsSolverScreen(onBack: () -> Unit) {
              Column(modifier = Modifier.fillMaxSize().padding(18.dp).verticalScroll(rememberScrollState())) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("पायरी-पायरीने गणित स्पष्टीकरण", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Text("[नमुना स्पष्टीकरण - Step-by-Step Guide]", fontSize = 12.sp, color = Color.Gray)
                  Spacer(modifier = Modifier.height(16.dp))
                  Card(modifier = Modifier.fillMaxWidth(), colors = CardDefaults.cardColors(containerColor = SecondaryBlue.copy(alpha = 0.1f))) {
                      Column(modifier = Modifier.padding(16.dp)) {
                          Text("समीकरण सोडवा: 2x + 7 = 19, तर x = ?", fontWeight = FontWeight.Bold, fontSize = 16.sp)
                      }
                  }
                  Spacer(modifier = Modifier.height(16.dp))
                  Text("पायरी १: 2x + 7 = 19\nपायरी २: 2x = 19 - 7\nपायरी ३: 2x = 12\nपायरी ४: x = 12 / 2\nउत्तर: x = 6", lineHeight = 26.sp, fontSize = 16.sp)
              }
          }

          data class Question(val q: String, val options: List<String>, val correct: Int)

          @Composable
          fun QuizScreen(selectedSubject: String, onBack: () -> Unit) {
              val questions = listOf(
                  Question("पाण्याचे रासायनिक सूत्र काय आहे?", listOf("NaCl", "CO2", "H2O", "O2"), 2),
                  Question("त्रिकोणाच्या तिन्ही कोनांची बेरीज किती असते?", listOf("90°", "180°", "360°", "270°"), 1)
              )
              var qIdx by remember { mutableStateOf(0) }
              var selected by remember { mutableStateOf<Int?>(null) }
              var score by remember { mutableStateOf(0) }
              var done by remember { mutableStateOf(false) }

              Column(modifier = Modifier.fillMaxSize().padding(18.dp)) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("सराव चाचणी ($selectedSubject)", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Spacer(modifier = Modifier.height(16.dp))
                  if (!done) {
                      val current = questions[qIdx]
                      Text("प्रश्न ${qIdx + 1} / ${questions.size}", color = SecondaryBlue, fontWeight = FontWeight.Bold)
                      Spacer(modifier = Modifier.height(6.dp))
                      Text(current.q, fontSize = 18.sp, fontWeight = FontWeight.Bold)
                      Spacer(modifier = Modifier.height(14.dp))
                      current.options.forEachIndexed { i, opt ->
                          OutlinedButton(
                              onClick = { selected = i },
                              modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp),
                              colors = ButtonDefaults.outlinedButtonColors(
                                  containerColor = if (selected == i) PrimaryPurple.copy(alpha = 0.15f) else Color.Transparent
                              )
                          ) {
                              Text(opt, color = TextDark)
                          }
                      }
                      Spacer(modifier = Modifier.height(16.dp))
                      Button(
                          onClick = {
                              if (selected == current.correct) score++
                              if (qIdx + 1 < questions.size) {
                                  qIdx++
                                  selected = null
                              } else done = true
                          },
                          enabled = selected != null,
                          modifier = Modifier.fillMaxWidth().height(50.dp),
                          colors = ButtonDefaults.buttonColors(containerColor = PrimaryPurple)
                      ) {
                          Text(if (qIdx + 1 < questions.size) "पुढील प्रश्न (Next)" else "निकाल पहा (Finish)")
                      }
                  } else {
                      Card(modifier = Modifier.fillMaxWidth().padding(top = 20.dp)) {
                          Column(modifier = Modifier.padding(24.dp), horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("अभिनंदन!", fontSize = 22.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                              Text("तुमचा निकाल: $score / ${questions.size}", fontSize = 18.sp)
                              Spacer(modifier = Modifier.height(16.dp))
                              Button(onClick = { qIdx = 0; selected = null; score = 0; done = false }) { Text("पुन्हा सोडवा (Restart)") }
                          }
                      }
                  }
              }
          }

          data class Task(val id: Long, val text: String, val done: Boolean)

          @Composable
          fun ChecklistScreen(prefs: SharedPreferences, onBack: () -> Unit) {
              var taskString by remember { mutableStateOf(prefs.getString("tasks", "1:विज्ञान धडा १ वाचन:true,2:गणित सरावसंच सोडवणे:false") ?: "") }
              var newText by remember { mutableStateOf("") }

              val tasks = remember(taskString) {
                  if (taskString.isBlank()) emptyList()
                  else taskString.split(",").filter { it.isNotBlank() }.mapNotNull {
                      val p = it.split(":")
                      if (p.size == 3) Task(p[0].toLong(), p[1], p[2].toBoolean()) else null
                  }
              }

              fun save(updated: List<Task>) {
                  val s = updated.joinToString(",") { "${it.id}:${it.text}:${it.done}" }
                  prefs.edit().putString("tasks", s).apply()
                  taskString = s
              }

              Column(modifier = Modifier.fillMaxSize().padding(18.dp)) {
                  IconButton(onClick = onBack) { Icon(Icons.Default.ArrowBack, contentDescription = null) }
                  Text("दैनिक अभ्यास यादी (Checklist)", fontSize = 20.sp, fontWeight = FontWeight.Bold, color = PrimaryPurple)
                  Spacer(modifier = Modifier.height(14.dp))
                  Row(modifier = Modifier.fillMaxWidth()) {
                      OutlinedTextField(value = newText, onValueChange = { newText = it }, placeholder = { Text("नवीन कार्य...") }, modifier = Modifier.weight(1f))
                      Spacer(modifier = Modifier.width(6.dp))
                      Button(onClick = {
                          if (newText.isNotBlank()) {
                              save(tasks + Task(System.currentTimeMillis(), newText.trim(), false))
                              newText = ""
                          }
                      }) { Icon(Icons.Default.Add, contentDescription = null) }
                  }
                  Spacer(modifier = Modifier.height(12.dp))
                  LazyColumn {
                      items(tasks) { t ->
                          Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp)) {
                              Row(modifier = Modifier.padding(10.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Checkbox(checked = t.done, onCheckedChange = { chk -> save(tasks.map { if (it.id == t.id) it.copy(done = chk) else it }) })
                                  Text(t.text, modifier = Modifier.weight(1f))
                                  IconButton(onClick = { save(tasks.filterNot { it.id == t.id }) }) { Icon(Icons.Default.Delete, contentDescription = null, tint = Color.Red) }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun LargeButton(title: String, subtitle: String, isSelected: Boolean, onClick: () -> Unit) {
              Card(
                  modifier = Modifier.fillMaxWidth().clickable { onClick() },
                  colors = CardDefaults.cardColors(containerColor = if (isSelected) PrimaryPurple.copy(alpha = 0.12f) else CardSurface),
                  border = if (isSelected) androidx.compose.foundation.BorderStroke(2.dp, PrimaryPurple) else null
              ) {
                  Row(modifier = Modifier.padding(18.dp), verticalAlignment = Alignment.CenterVertically) {
                      Column(modifier = Modifier.weight(1f)) {
                          Text(title, fontSize = 17.sp, fontWeight = FontWeight.Bold)
                          Text(subtitle, fontSize = 13.sp, color = Color.Gray)
                      }
                      if (isSelected) Icon(Icons.Default.CheckCircle, contentDescription = null, tint = PrimaryPurple)
                  }
              }
          }

          @Composable
          fun DashCard(title: String, icon: androidx.compose.ui.graphics.vector.ImageVector, color: Color, onClick: () -> Unit) {
              Card(modifier = Modifier.fillMaxWidth().clickable { onClick() }) {
                  Row(modifier = Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                      Icon(icon, contentDescription = null, tint = color, modifier = Modifier.size(32.dp))
                      Spacer(modifier = Modifier.width(14.dp))
                      Text(title, fontWeight = FontWeight.SemiBold, fontSize = 15.sp)
                  }
              }
          }
