              }
          }

          @Composable
          fun StudySaathiApp() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("studysaathi_prefs", Context.MODE_PRIVATE) }
              var currentScreen by remember { mutableStateOf<AppScreen>(AppScreen.Welcome) }
              var selectedLanguage by remember { mutableStateOf(prefs.getString("lang", "मराठी") ?: "मराठी") }
              var selectedClass by remember { mutableStateOf(prefs.getString("class", "10") ?: "10") }
              var selectedSubject by remember { mutableStateOf(prefs.getString("subject", "गणित") ?: "गणित") }

              MaterialTheme(
                  colorScheme = lightColorScheme(
                      primary = PrimaryPurple,
                      secondary = SecondaryBlue,
                      background = SoftBackground,
                      surface = CardSurface
                  )
              ) {
                  Surface(modifier = Modifier.fillMaxSize(), color = MaterialTheme.colorScheme.background) {
                      when (currentScreen) {
                          is AppScreen.Welcome -> WelcomeScreen(onGetStarted = { currentScreen = AppScreen.LanguageSelect })
                          is AppScreen.LanguageSelect -> LanguageSelectScreen(
                              selectedLang = selectedLanguage,
                              onSelect = { lang ->
                                  selectedLanguage = lang
                                  prefs.edit().putString("lang", lang).apply()
                                  currentScreen = AppScreen.ClassSelect
                              }
                          )
                          is AppScreen.ClassSelect -> ClassSelectScreen(
                              selectedClass = selectedClass,
                              onSelect = { cls ->
                                  selectedClass = cls
                                  prefs.edit().putString("class", cls).apply()
                                  currentScreen = AppScreen.SubjectSelect
                              },
                              onBack = { currentScreen = AppScreen.LanguageSelect }
                          )
                          is AppScreen.SubjectSelect -> SubjectSelectScreen(
                              selectedSubject = selectedSubject,
                              onSelect = { subj ->
                                  selectedSubject = subj
                                  prefs.edit().putString("subject", subj).apply()
                                  currentScreen = AppScreen.Dashboard
                              },
                              onBack = { currentScreen = AppScreen.ClassSelect }
                          )
                          is AppScreen.Dashboard -> DashboardScreen(
                              selectedLang = selectedLanguage,
                              selectedClass = selectedClass,
                              selectedSubject = selectedSubject,
                              onNavigateTo = { screen -> currentScreen = screen },
                              onChangeSettings = { currentScreen = AppScreen.LanguageSelect }
                          )
                          is AppScreen.Notes -> NotesScreen(selectedClass = selectedClass, selectedSubject = selectedSubject, onBack = { currentScreen = AppScreen.Dashboard })
                          is AppScreen.MathsSolver -> MathsSolverScreen(onBack = { currentScreen = AppScreen.Dashboard })
                          is AppScreen.Quiz -> QuizScreen(selectedSubject = selectedSubject, onBack = { currentScreen = AppScreen.Dashboard })
                          is AppScreen.Checklist -> ChecklistScreen(prefs = prefs, onBack = { currentScreen = AppScreen.Dashboard })
                      }
